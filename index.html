<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>ダンジョンアタック</title>
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ダンジョンアタック">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen handheld — black viewport on top, worn-stone control slab below; gold-on-black title and result screens */
:root{
  --bg:#0a0c0f;
  --slab:#15171a;
  --stone:#25272b;
  --stone-hi:#34373c;
  --line:#3a3d43;
  --lamp:#f3c36a;
  --lamp-dim:#9c7c45;
  --gold:#ffd25a;
  --text:#ddd6c8;
  --muted:#8a867e;
  --hp:#d9644f;
  --water:#6fb3d9;
  --curse:#a77ae0;
  --f-display:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --f-ui:"DotGothic16","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-logo:"Dela Gothic One","Hiragino Kaku Gothic StdN","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--text);font-family:var(--f-ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-family:var(--f-logo);font-weight:400;font-size:19px;letter-spacing:.04em;white-space:nowrap;
  background:linear-gradient(#fff2c0,#f3c36a 55%,#b8762a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hud-r{display:flex;align-items:center;gap:8px}
.compass{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.compass b{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;color:var(--lamp);font-weight:400;font-size:15px;background:var(--slab)}
.btn-s{font:inherit;font-size:13px;color:var(--text);background:var(--stone);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;touch-action:manipulation}
.btn-s[aria-pressed="true"]{color:var(--lamp);border-color:var(--lamp-dim)}

.view{position:relative;flex:1;min-height:180px;border-radius:8px;overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:inset 0 0 40px #000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv.shake{animation:shake .18s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,1px)}}
@media (prefers-reduced-motion:reduce){#cv.shake{animation:none}}
.vhud{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.vhud span{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(243,195,106,.3);color:var(--lamp);font-variant-numeric:tabular-nums}
.vhud .loot{color:var(--gold);border-color:rgba(255,210,90,.5)}
.vhud .loot.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.25);background:rgba(120,80,10,.8)}100%{transform:scale(1)}}
.msg{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 10px;font-size:14px;line-height:1.5;color:var(--lamp);
  background:linear-gradient(transparent,rgba(0,0,0,.85) 45%);min-height:3.2em;text-wrap:balance}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(5,6,8,.9);padding:16px;text-align:center}
#mapcv{max-width:100%;image-rendering:pixelated;border:1px solid var(--line);background:#050607}
.map-legend{font-size:12px;color:var(--muted);line-height:1.6}
.map-legend i{font-style:normal;display:inline-block;width:10px;height:10px;margin:0 3px 0 8px;vertical-align:-1px;border-radius:2px}
.cd{display:flex;align-items:baseline;gap:10px;color:var(--muted);font-size:12px}
.cd b{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1;color:var(--lamp);min-width:1.4em;text-align:center;font-variant-numeric:tabular-nums}
.cd b.zero{color:#e88a6a}
.ask{background:rgba(5,6,8,.82)}
.ask p{margin:0;font-size:16px;line-height:1.7;color:var(--text);white-space:pre-line;max-width:22em}
.ask p b{color:var(--gold);font-weight:400}
.ask-btns{display:flex;flex-direction:column;gap:10px;width:min(100%,260px)}
.fade{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s}
.fade.on{opacity:1}
.fade b{font-family:var(--f-logo);font-weight:400;font-size:34px;letter-spacing:.08em;
  background:linear-gradient(#fff2c0,#f3c36a 55%,#b8762a);-webkit-background-clip:text;background-clip:text;color:transparent}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;align-items:end}
.row2{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pw{display:flex;align-items:center;gap:8px;min-width:0}
.label{font-size:11px;letter-spacing:.06em;color:var(--muted)}
.curse{display:flex;gap:4px}
.curse i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);background:#000}
.curse i.on{background:var(--curse);border-color:var(--curse);box-shadow:0 0 6px var(--curse)}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat span{font-size:11px;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.bar{height:8px;background:#000;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .2s}
#bHp i{background:var(--hp)} #bWat i{background:var(--water)}
.skin{display:flex;gap:3px}
.skin i{width:12px;height:16px;border:1px solid var(--line);border-radius:3px 3px 6px 6px;background:#000}
.skin i.on{background:var(--water);border-color:var(--water)}

.pad{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:58px;grid-template-areas:"l f r h" "m x e h";gap:8px;padding:10px;background:var(--slab);border:1px solid var(--line);border-radius:10px}
.pad button{font:inherit;font-size:14px;color:var(--text);height:100%;min-width:0;border-radius:8px;border:1px solid var(--line);cursor:pointer;touch-action:manipulation;
  background:linear-gradient(var(--stone-hi),var(--stone));box-shadow:0 3px 0 #0b0c0e,inset 0 1px 0 rgba(255,255,255,.06);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.pad button em{font-style:normal;font-size:18px;color:var(--lamp)}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0c0e;border-color:var(--lamp-dim)}
.pad button:focus-visible,.btn-s:focus-visible,.btn-main:focus-visible,.btn-ghost:focus-visible,.diff button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.pad .act{color:var(--lamp)}
.pad .hit{color:#ffd9c8;font-size:17px;letter-spacing:.1em;background:linear-gradient(#7a3426,#4f1f17);border-color:#9b4a36}
.pad .hit em{color:#ffb08f;font-size:24px}
.pad button[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp)}
#bL{grid-area:l}#bF{grid-area:f}#bR{grid-area:r}#bH{grid-area:h}#bM{grid-area:m}#bX{grid-area:x}#bE{grid-area:e}
.keys{font-size:11px;color:var(--muted);text-align:center;margin:0}
@media (max-height:640px){.pad{grid-auto-rows:50px}.keys{display:none}}
@media (hover:none){.keys{display:none}}

/* title & result screens */
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:radial-gradient(ellipse 80% 55% at 50% 30%,#2b2014 0%,#120f0c 55%,#07080a 100%)}
.screen-in{min-height:100%;max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding-inline:16px;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.title-chest{width:min(42vw,150px);height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.7)) drop-shadow(0 0 22px rgba(255,190,80,.25))}
.logo{margin:0;font-family:var(--f-logo);font-weight:400;font-size:clamp(34px,11vw,56px);line-height:1.04;letter-spacing:.02em;
  background:linear-gradient(#fff7d6 8%,#ffd25a 45%,#c2761a 85%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #3a1a04) drop-shadow(0 0 16px rgba(255,180,60,.3))}
.logo-sub{margin:0;color:var(--lamp);font-size:14px;letter-spacing:.14em}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.diff button{font:inherit;color:var(--text);text-align:left;cursor:pointer;padding:12px;border-radius:10px;border:1px solid var(--line);
  background:rgba(37,39,43,.85);display:flex;flex-direction:column;gap:6px;min-width:0;touch-action:manipulation}
.diff button b{font-family:var(--f-logo);font-weight:400;font-size:17px;color:var(--text)}
.diff button small{font-size:11px;line-height:1.55;color:var(--muted)}
.diff button[aria-checked="true"]{border-color:var(--gold);background:linear-gradient(rgba(120,82,20,.55),rgba(50,36,12,.75));box-shadow:0 0 0 1px var(--gold) inset,0 0 18px rgba(255,190,70,.18)}
.diff button[aria-checked="true"] b{color:var(--gold)}
.diff button[aria-checked="true"] small{color:#e6d6b4}
.btn-main{font-family:var(--f-logo);font-weight:400;font-size:20px;letter-spacing:.06em;color:#2a1604;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(#ffe9a6,#f4b13a);border:0;border-radius:12px;padding:14px 20px;box-shadow:0 4px 0 #7a4a12,0 0 24px rgba(255,180,60,.25);width:100%}
.btn-main:active{transform:translateY(3px);box-shadow:0 1px 0 #7a4a12}
.btn-ghost{font:inherit;font-size:15px;color:var(--text);cursor:pointer;background:transparent;border:1px solid var(--lamp-dim);border-radius:12px;padding:11px 20px;width:100%;touch-action:manipulation}
.best{margin:0;color:var(--lamp);font-size:14px;font-variant-numeric:tabular-nums}
.status{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.rules{margin:4px 0 0;padding:12px 14px 12px 30px;text-align:left;font-size:12px;line-height:1.75;color:var(--muted);border-top:1px solid var(--line);width:100%}
.rules b{color:var(--text);font-weight:400}
.res-head{margin:0;font-family:var(--f-logo);font-weight:400;font-size:clamp(30px,9vw,44px);
  background:linear-gradient(#fff7d6 8%,#ffd25a 45%,#c2761a 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a1a04)}
.res-head.dead{background:linear-gradient(#e9d6d0,#b05a4a 60%,#5a1f18);-webkit-background-clip:text;background-clip:text}
.res-sub{white-space:pre-line;margin:0;font-size:14px;line-height:1.7;color:var(--text)}
.res-score{display:flex;flex-direction:column;align-items:center;gap:2px}
.res-score span{font-size:12px;color:var(--muted);letter-spacing:.1em}
.res-score b{font-family:var(--f-logo);font-weight:400;font-size:46px;line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums}
.res-list{list-style:none;margin:0;padding:0;width:100%;font-size:14px;max-height:30vh;overflow-y:auto}
.res-list li{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.res-list li span:nth-child(2){color:var(--muted)}
.res-list li span:last-child{color:var(--gold);min-width:4.5em;text-align:right}
.res-list li.none{display:block;text-align:center;color:var(--muted);border:0}
</style>
</head>
<body>


<div class="app">
  <header>
    <h1>ダンジョンアタック</h1>
    <div class="hud-r">
      <div class="compass">向き<b id="dir">北</b></div>
      <button class="btn-s" id="sndBtn" aria-pressed="true">音 オン</button>
    </div>
  </header>

  <div class="view" id="view">
    <canvas id="cv"></canvas>
    <div class="vhud"><span id="floorLbl">地下1階</span><span class="loot" id="lootLbl">宝 0pt</span></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="overlay" id="mapOv" hidden>
      <canvas id="mapcv"></canvas>
      <div class="cd">敵が動くまで<b id="mapCd">10</b>秒</div>
      <div class="map-legend" id="mapLegend"></div>
    </div>
    <div class="overlay ask" id="askOv" hidden>
      <p id="askText"></p>
      <div class="ask-btns"><button class="btn-main" id="askYes">はい</button><button class="btn-ghost" id="askNo">やめる</button></div>
    </div>
    <div class="fade" id="fadeOv" hidden><b id="fadeText"></b></div>
  </div>

  <div class="stats">
    <div class="stat"><span>体力<b id="vHp">100</b></span><div class="bar" id="bHp"><i></i></div></div>
    <div class="stat"><span>水分<b id="vWat">100</b></span><div class="bar" id="bWat"><i></i></div></div>
    <div class="row2">
      <div class="pw"><span class="label">水筒</span><div class="skin" id="skin"></div></div>
      <div class="pw"><span class="label" id="curseLbl">呪い</span><div class="curse" id="curse"></div></div>
    </div>
  </div>

  <div class="pad">
    <button id="bL"><em>↶</em>左を向く</button>
    <button id="bF"><em>▲</em>前へ</button>
    <button id="bR"><em>↷</em>右を向く</button>
    <button id="bH" class="hit"><em>✊</em>叩く</button>
    <button id="bM" aria-pressed="false">地図</button>
    <button id="bX" class="act">調べる</button>
    <button id="bE" class="act">飲む</button>
  </div>
  <p class="keys">キーボード: ↑ 前へ ／ ←→ 向き ／ F 叩く ／ Space 調べる ／ E 飲む ／ M 地図</p>
</div>

<section class="screen" id="titleScr" hidden>
  <div class="screen-in">
    <img class="title-chest" id="titleChest" alt="">
    <h2 class="logo">ダンジョン<br>アタック</h2>
    <p class="logo-sub">宝を集めて、生きて地上へ帰れ</p>
    <div class="diff" role="radiogroup" aria-label="難易度">
      <button id="dEasy" role="radio" aria-checked="false"><b>イージー</b><small>地下3階まで<br>ぶつかってもダメージなし<br>渇き・呪い・ミイラ男の攻撃が半分</small></button>
      <button id="dNormal" role="radio" aria-checked="true"><b>ノーマル</b><small>地下5階まで<br>深いほど宝は高価、敵も増える<br>最深部には宝剣が眠る</small></button>
    </div>
    <button class="btn-main" id="startBtn">探索開始</button>
    <p class="best" id="titleBest">自己ベスト 0pt</p>
    <button class="btn-ghost" id="titleRank">🏆 ランキング</button>
    <ul class="rules">
      <li><b>宝箱</b>は正面に立って［調べる］で開ける</li>
      <li><b>階段</b>で下の階へ。地下1階の入口の縄ばしごから地上に戻ると、持ち帰った宝の合計が記録になる</li>
      <li>力尽きると、集めた宝はすべて失われる</li>
      <li>幽霊は1回、ミイラ男は2回叩けば倒せる。泉で水を補給できる</li>
    </ul>
  </div>
</section>

<section class="screen" id="resultScr" hidden>
  <div class="screen-in">
    <h2 class="res-head" id="resHead"></h2>
    <p class="res-sub" id="resSub"></p>
    <div class="res-score"><span id="resLabel">持ち帰った宝</span><b id="resScore">0</b></div>
    <ul class="res-list" id="resList"></ul>
    <p class="best" id="resBest"></p>
    <p class="status" id="resStatus"></p>
    <button class="btn-main" id="againBtn">タイトルへ</button>
    <button class="btn-ghost" id="resRank">🏆 ランキング</button>
  </div>
</section>

<script src="config.js"></script>
<script src="maruo-opening.js"></script>
<script src="maruo-ranking.js"></script>
<script>
(()=>{
const ranking=MaruoRanking.init({
  gameId:'dungeon-attack',
  supabaseUrl:(window.MARUO_CONFIG||{}).SUPABASE_URL,
  supabaseKey:(window.MARUO_CONFIG||{}).SUPABASE_KEY
});
const N=41, SKIN=5, SPRINGS=5, DX=[0,1,0,-1], DY=[-1,0,1,0], DIRN=['北','東','南','西'];
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d'), view=$('view');
const off=document.createElement('canvas'), octx=off.getContext('2d');
let W=0,H=0,DPR=1,RW=0,RH=0,Fp=0,img=null,buf=null,zbuf=null;
let S=null, warned={}, dirty=true, liveScene=false, anim=null;
const Vf=new Uint8Array(N*N), springArr=new Uint8Array(N*N);
const cam={x:1.5,y:1.5,a:0,bob:0,sway:0,push:0};

/* ---------- utilities ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(x,y,k){let h=(x*374761393+y*668265263+k*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return (h^(h>>>16))>>>0}
const h01=i=>(Math.imul(i+1,2654435761)>>>0)/4294967296;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const get=(x,y)=>(x<0||y<0||x>=N||y>=N)?1:S.grid[y][x];
const isWall=v=>v===1||v===2;
const key=(x,y)=>y*N+x;
function cell(f,l){const r=(S.d+1)%4;return{x:S.x+DX[S.d]*f+DX[r]*l,y:S.y+DY[S.d]*f+DY[r]*l}}

/* ---------- procedural textures ---------- */
let VF1=0,VF2=0,VID=0;
function makeVor(w,h,gx,gy,seed){
  const r=mulberry32(seed),n=gx*gy,px=new Float32Array(n),py=new Float32Array(n);
  for(let i=0;i<n;i++){px[i]=r();py[i]=r()}
  const cw=w/gx,ch=h/gy;
  return (u,v)=>{const fx=u/cw,fy=v/ch,ix=Math.floor(fx),iy=Math.floor(fy);let f1=9,f2=9,id=0;
    for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const cx=ix+i,cy=iy+j,wx=((cx%gx)+gx)%gx,wy=((cy%gy)+gy)%gy,k=wy*gx+wx;
      const dx=cx+px[k]-fx,dy=cy+py[k]-fy,d=Math.sqrt(dx*dx+dy*dy);
      if(d<f1){f2=f1;f1=d;id=k}else if(d<f2)f2=d}
    VF1=f1;VF2=f2;VID=id};
}
function makeNoise(w,h,gx,gy,seed){
  const r=mulberry32(seed),g=new Float32Array(gx*gy);for(let i=0;i<g.length;i++)g[i]=r();
  return (u,v)=>{const fx=u/w*gx,fy=v/h*gy,ix=Math.floor(fx),iy=Math.floor(fy);let tx=fx-ix,ty=fy-iy;tx=tx*tx*(3-2*tx);ty=ty*ty*(3-2*ty);
    const x0=((ix%gx)+gx)%gx,x1=(x0+1)%gx,y0=((iy%gy)+gy)%gy,y1=(y0+1)%gy;
    const a=g[y0*gx+x0],b=g[y0*gx+x1],c=g[y1*gx+x0],d=g[y1*gx+x1];

          const ti=((((wy*128)|0)&255)<<8)|(((wx*128)|0)&255),t3=ti*3;

function project(X,Y,px,py,fx,fy,rx,ry){const ox=X-px,oy=Y-py;const dz=ox*fx+oy*fy,lat=ox*rx+oy*ry;return[dz,RW*0.5+lat/dz*Fp]}

function sprites(px,py,fx,fy,rx,ry,cyp){
  // falling drips above springs

    const kx=k%N,ky=(k/N)|0,[dz,sx]=project(kx+D.dcx,ky+D.dcy,px,py,fx,fy,rx,ry);

  const top=cyp-0.5*Fp/dz,bot=cyp+0.5*Fp/dz;

    if(dz>=zbuf[c])continue;const u=Math.abs((c+0.5-sx)/hs);const g=Math.pow(1-u,2)*48;
    for(let y=Math.max(0,top|0);y<Math.min(RH,bot);y++){const f=0.45+0.55*(1-(y-top)/(bot-top));addPx(c,y,g*f*0.7,g*f*0.82,g*f)}}

    if(dz>=zbuf[c])continue;const u=(c+0.5-(sx-hw))/(2*hw);const rail=u<0.13||u>0.87;
    for(let y=Math.max(0,ry0|0);y<Math.min(RH,bot);y++){

      if(!(rail||(rv<0.17&&u>0.05&&u<0.95)))continue;
      const lgt=(S.floor===1?0.55+0.45*(0.5-hW):flash(EX,EY,hW,c,y)*0.9)+(rail?0:0.1),sh=rail?(0.75+0.25*Math.sin(u*Math.PI*7)):1;
      const i=(y*RW+c)*4;put(i,0.55*lgt*sh,0.42*lgt*sh,0.27*lgt*sh)}}
}

/* ---------- visibility ---------- */
function visList(x,y,d){
  const out=[],r=(d+1)%4;
  const C=(f,l)=>[x+DX[d]*f+DX[r]*l,y+DY[d]*f+DY[r]*l];
  const add=([cx,cy])=>{if(cx>=0&&cy>=0&&cx<N&&cy<N)out.push(key(cx,cy))};
  const wall=([cx,cy])=>isWall(get(cx,cy));
  for(let f=0;f<=3;f++){
    const c=C(f,0);add(c);if(wall(c))break;
    for(const l of[-1,1]){const s=C(f,l);if(wall(s)||f<=1)add(s);
      if(f===0&&!wall(s)){const o=C(0,2*l);if(wall(o))add(o)}}
  }
  const aheadOpen=!wall(C(1,0));
  for(const l of[-1,1]){const dg=C(1,l),side=C(0,l);
    if(wall(dg)){if(!wall(side))add(dg);continue}
    if(!aheadOpen&&wall(side))continue;
    add(dg);const n=C(2,l);if(wall(n))add(n);const o=C(1,2*l);if(wall(o))add(o);
  }
  return out;
}
function setVis(...lists){Vf.fill(0);liveScene=false;
  for(const L of lists)for(const k of L){Vf[k]=1;if(springArr[k]||k===upKey||(chestArr[k]&&!S.chests[k].open))liveScene=true}
  for(const k of lists[lists.length-1])S.seen[k]=1;
  dirty=true;
}

/* ---------- camera & animation ---------- */
const BACK=0.46;
function placeCam(cx,cy,a){cam.a=a;cam.x=cx-Math.sin(a)*BACK;cam.y=cy+Math.cos(a)*BACK}
let camAng=0;
function snap(){if(!anim)return;anim=null;cam.bob=cam.sway=cam.push=0;placeCam(S.x+0.5,S.y+0.5,camAng);setVis(visList(S.x,S.y,S.d))}
function startAnim(type,from,dir){
  const prev=visList(from.x,from.y,from.d),next=visList(S.x,S.y,S.d);
  anim={type,dir,t0:performance.now(),dur:type==='turn'?190:type==='bump'?200:type==='lunge'?260:210,c0x:from.x+0.5,c0y:from.y+0.5,a0:from.a,c1x:S.x+0.5,c1y:S.y+0.5,a1:camAng};
  setVis(prev,next);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)snap();
}
function updateCam(now){
  if(!anim)return;
  const p=clamp((now-anim.t0)/anim.dur,0,1),e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  placeCam(anim.c0x+(anim.c1x-anim.c0x)*e,anim.c0y+(anim.c1y-anim.c0y)*e,anim.a0+(anim.a1-anim.a0)*e);
  cam.bob=anim.type==='move'?Math.sin(p*Math.PI)*0.014:0;
  cam.sway=anim.type==='turn'?-anim.dir*Math.sin(p*Math.PI)*0.06:0;
  cam.push=anim.type==='bump'?Math.sin(p*Math.PI)*0.08*anim.dir:anim.type==='lunge'?(p<0.35?Math.sin(p/0.35*Math.PI/2):Math.cos((p-0.35)/0.65*Math.PI/2))*0.16:0;
  if(p>=1)snap();
}

/* ---------- dust in the beam ---------- */
const motes=Array.from({length:34},()=>({x:Math.random(),y:Math.random(),z:0.3+Math.random()*0.7,vx:(Math.random()-0.5)*0.008,vy:(Math.random()-0.3)*0.006,p:Math.random()*6}));
function composite(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(off,0,0,W,H);
  const cx=W*(0.5+cam.sway),cy=H*0.57,R=Math.min(W,H)*0.55,dt=1/30;
  ctx.globalCompositeOperation='lighter';
  for(const m of motes){
    m.x+=m.vx*dt*m.z;m.y+=m.vy*dt*m.z;m.p+=dt;
    if(m.x<0)m.x+=1;if(m.x>1)m.x-=1;if(m.y<0)m.y+=1;if(m.y>1)m.y-=1;
    const X=m.x*W,Y=m.y*H,d=Math.hypot(X-cx,Y-cy)/R;if(d>1)continue;
    const a=(1-d)*(1-d)*(0.35+0.25*Math.sin(m.p*1.7))*m.z;
    ctx.fillStyle=`rgba(255,226,180,${a.toFixed(3)})`;ctx.beginPath();ctx.arc(X,Y,0.6+m.z*1.1,0,Math.PI*2);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(S&&S.curse>0){const k=(0.16+0.05*Math.sin(now/600))*S.curse;const c=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.25,W/2,H/2,Math.max(W,H)*0.7);
    c.addColorStop(0,'rgba(90,40,150,0)');c.addColorStop(1,`rgba(90,40,150,${k.toFixed(3)})`);ctx.fillStyle=c;ctx.fillRect(0,0,W,H)}
  if(strike)drawStrike(now);
  if(hurt>0){ctx.fillStyle=`rgba(${hurtCol},${(hurt*0.42).toFixed(3)})`;ctx.fillRect(0,0,W,H);hurt=Math.max(0,hurt-0.07)}
}
let lastF=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!S||!img||document.hidden)return;
  if(now-lastF<(anim?20:33))return;
  lastF=now;TIME=now/1000;NOW=now;

  const [dz,sx]=project(X,Y,px,py,fx,fy,rx,ry);if(dz<0.2)return;
  const ghost=type==='ghost',G=SPR_GEO[type],bob=ghost?Math.sin(TIME*2.2+X*3)*0.035:0;
  const sway=ghost?Math.sin(TIME*1.3)*0.05:0;
  const hgt=(G.bot-G.top)*Math.min(1,squash),top=G.bot-hgt+bob,bot=G.bot+bob,hw=G.hw*(ghost&&squash>1?squash:1);
  const c0=Math.max(0,Math.floor(sx-hw*Fp/dz)),c1=Math.min(RW-1,Math.ceil(sx+hw*Fp/dz));
  const y0=Math.max(0,Math.floor(cyp+top*Fp/dz)),y1=Math.min(RH-1,Math.ceil(cyp+bot*Fp/dz));
  const Lm=T.L,tw=T.w,th=T.h;
  for(let c=c0;c<=c1;c++){
    if(dz>=zbuf[c])continue;const U=(c+0.5-sx)*dz/Fp;
    for(let y=y0;y<=y1;y++){
      const Yw=(y+0.5-cyp)*dz/Fp,v=(Yw-top)/(bot-top);if(v<0||v>=1)continue;
      let u=(U/hw+1)*0.5+(ghost?sway*(1-v):0);if(u<0||u>=1)continue;
      // bilinear sample
      const fx2=u*tw-0.5,fy2=v*th-0.5,ix=Math.max(0,Math.min(tw-2,Math.floor(fx2))),iy=Math.max(0,Math.min(th-2,Math.floor(fy2)));
      const ax=clamp(fx2-ix,0,1),ay=clamp(fy2-iy,0,1),i00=(iy*tw+ix)*4,i10=i00+4,i01=i00+tw*4,i11=i01+4;
      const w00=(1-ax)*(1-ay),w10=ax*(1-ay),w01=(1-ax)*ay,w11=ax*ay;
      let A=Lm[i00+3]*w00+Lm[i10+3]*w10+Lm[i01+3]*w01+Lm[i11+3]*w11;if(A<0.02)continue;
      const r=(Lm[i00]*w00+Lm[i10]*w10+Lm[i01]*w01+Lm[i11]*w11),g=(Lm[i00+1]*w00+Lm[i10+1]*w10+Lm[i01+1]*w01+Lm[i11+1]*w11),b=(Lm[i00+2]*w00+Lm[i10+2]*w10+Lm[i01+2]*w01+Lm[i11+2]*w11);
      const I=flash(X,Y,Yw,c,y),i=(y*RW+c)*4;
      let R=r*I*1.15,Gc=g*I*1.05,B=b*I*0.9;
      if(ghost){R+=r*0.10+0.012;Gc+=g*0.12+0.016;B+=b*0.17+0.026;A*=0.82}
      if(EXL){const e=1.4/(1+2.6*((EX-X)**2+(EY-Y)**2+1));R+=r*e*0.6;Gc+=g*e*0.75;B+=b*e}
      if(white){R+=1.4;Gc+=1.4;B+=1.4}
      blendPx(i,R,Gc,B,Math.min(1,A*alphaMul));
    }
  }
}
function drawShape(type,X,Y,px,py,fx,fy,rx,ry,cyp,alphaMul,squash,white){
  const [dz,sx]=project(X,Y,px,py,fx,fy,rx,ry);if(dz<0.2)return;
  const ghost=type==='ghost',bob=ghost?Math.sin(TIME*2.2+X*3)*0.035:0;
  const hw=ghost?0.32:0.25,top=ghost?-0.45:-0.36,bot=ghost?0.4:0.5;
  const c0=Math.max(0,Math.floor(sx-hw*Fp/dz)),c1=Math.min(RW-1,Math.ceil(sx+hw*Fp/dz));
  const y0=Math.max(0,Math.floor(cyp+(top+bob)*Fp/dz)),y1=Math.min(RH-1,Math.ceil(cyp+(bot+bob)*Fp/dz));
  const sh=ghost?ghostShift():0;
  for(let c=c0;c<=c1;c++){
    if(dz>=zbuf[c])continue;const U=(c+0.5-sx)*dz/Fp;
    for(let y=y0;y<=y1;y++){
      let Yw=(y+0.5-cyp)*dz/Fp-bob;
      if(squash<1){Yw=0.5-(0.5-Yw)/squash;if(Yw<-0.6)continue}
      if(ghost)shGhost(U+sh*(Yw+0.2),Yw);else shMummy(U,Yw);
      if(SA<=0.003)continue;
      const I=flash(X,Y,Yw,c,y),i=(y*RW+c)*4;
      let R=SR*SD*I+ER,G=SG*SD*I*0.9+EG,B=SB*SD*I*0.75+EB;
      if(EXL){const e=1.4/(1+2.6*((EX-X)**2+(EY-Y)**2+1));R+=SR*e*0.6;G+=SG*e*0.75;B+=SB*e}
      if(white){R+=1.5;G+=1.5;B+=1.5}
      blendPx(i,R,G,B,Math.min(1,SA*alphaMul));
    }
  }
}
function ghostShift(){return Math.sin(TIME*1.3)*0.08}
function enemyPos(e){const p=clamp((NOW-e.at)/230,0,1),q=p*p*(3-2*p);let X=e.ax+0.5+(e.x-e.ax)*q,Y=e.ay+0.5+(e.y-e.ay)*q;
  const k=(NOW-(e.kbT||-1e9))/420;
  if(k>=0&&k<1){const dx=X-(S.x+0.5),dy=Y-(S.y+0.5),d=Math.hypot(dx,dy)||1,amp=k<0.18?k/0.18:Math.pow(1-(k-0.18)/0.82,2);
    const j=Math.sin(k*70)*0.03*(1-k);X+=dx/d*0.28*amp+dy/d*j;Y+=dy/d*0.28*amp-dx/d*j}
  return[X,Y,p<1]}
function enemyShown(e){return Vf[key(e.x,e.y)]||(NOW-e.at<230&&Vf[key(e.ax,e.ay)])}
function drawEnemies(px,py,fx,fy,rx,ry,cyp){
  const list=[];
  for(const e of S.enemies){if(!enemyShown(e))continue;const [X,Y]=enemyPos(e);list.push({type:e.type,X,Y,a:1,sq:1,white:NOW-(e.hitT||-1e9)>=0&&NOW-(e.hitT||-1e9)<170})}
  for(let i=fades.length-1;i>=0;i--){const f=fades[i],p=(NOW-f.t0)/(f.type==='ghost'?600:700);if(p>=1){fades.splice(i,1);continue}
    if(!Vf[key(Math.floor(f.X),Math.floor(f.Y))])continue;
    list.push(f.type==='ghost'?{type:'ghost',X:f.X,Y:f.Y,a:1-p,sq:1+p*0.6,white:p<0.25}:{type:'mummy',X:f.X,Y:f.Y,a:1-p*p,sq:Math.max(0.12,1-p*1.1),white:p<0.2})}
  for(const k in S.chests){if(!Vf[k])continue;const c=S.chests[k];list.push({type:c.open?'chestO':'chestC',X:k%N+0.5,Y:((k/N)|0)+0.5,a:1,sq:1,white:false,chest:+k})}
  list.sort((a,b)=>Math.hypot(b.X-px,b.Y-py)-Math.hypot(a.X-px,a.Y-py));
  for(const s of list){drawSprite(s.type,s.X,s.Y,px,py,fx,fy,rx,ry,cyp,s.a,s.sq,s.white);if(s.type==='chestC')sparkle(s,px,py,fx,fy,rx,ry,cyp)}
}
// an occasional glint on unopened chests so they catch the eye in the dark
function sparkle(s,px,py,fx,fy,rx,ry,cyp){
  const P=TIME*0.55+s.chest*0.173,ph=P%1;if(ph>0.24)return;
  const a=Math.sin(ph/0.24*Math.PI),hs=hash(s.chest,Math.floor(P),7),ox=((hs&255)/255-0.5)*0.36,oh=0.42-((hs>>8)&255)/255*0.3;
  const [dz,sx]=project(s.X+rx*ox,s.Y+ry*ox,px,py,fx,fy,rx,ry);if(dz<0.2)return;
  const c=sx|0;if(c<0||c>=RW||dz>=zbuf[c])return;
  const sy=(cyp+oh*Fp/dz)|0,L=Math.max(2,(0.07*Fp/dz)|0),I=a*240;
  for(let j=-L;j<=L;j++){const f=Math.pow(1-Math.abs(j)/(L+1),2);addPx(c+j,sy,I*f,I*f*0.92,I*f*0.6);addPx(c,sy+j,I*f,I*f*0.92,I*f*0.6)}
}
function enemiesLive(){return fades.length>0||!!strike||S.enemies.some(e=>enemyShown(e)||NOW-e.at<260||NOW-(e.kbT||-1e9)<450)}

/* ---------- rules ---------- */
const DIFF={
  easy:{id:'easy',name:'イージー',maxFloor:3,drainEvery:4,curseLift:50,mummyDmg:5,wallDmg:0,mummyBump:0},
  normal:{id:'normal',name:'ノーマル',maxFloor:5,drainEvery:2,curseLift:100,mummyDmg:10,wallDmg:5,mummyBump:5}};
// w = how often each treasure appears on B1..B5 (relative weights; deeper floors favour the valuable ones)
const TREASURES=[
  {name:'ツボ',      v:10,  from:1,w:[40,20,10, 5, 3]},
  {name:'メダル',    v:100, from:1,w:[30,22,12, 7, 4]},
  {name:'ネックレス',v:200, from:1,w:[20,20,14,10, 6]},
  {name:'指輪',      v:300, from:1,w:[10,16,15,13,10]},
  {name:'腕輪',      v:400, from:2,w:[ 0,12,15,15,14]},
  {name:'歴史書',    v:500, from:2,w:[ 0,10,14,17,18]},
  {name:'宝盾',      v:800, from:3,w:[ 0, 0,12,18,22]},
  {name:'宝剣',      v:1000,from:3,w:[ 0, 0, 8,15,23]}];
function rollTreasure(n,R){
  const pool=TREASURES.filter(t=>t.from<=n),tot=pool.reduce((a,t)=>a+t.w[n-1],0);
  let r=R()*tot;for(const t of pool){r-=t.w[n-1];if(r<0)return t.name}return pool[pool.length-1].name;
}
const TV=Object.fromEntries(TREASURES.map(t=>[t.name,t.v]));
const LAST_FLOOR=5;
const chestArr=new Uint8Array(N*N);
let upKey=-1,downKey=-1;
const loot=()=>S?S.bag.reduce((a,b)=>a+b.v,0):0;
const fmt=n=>n.toLocaleString('ja-JP');

/* ---------- floor generation ---------- */
function genFloor(n){
  const R=Math.random;
  const g=Array.from({length:N},()=>Array(N).fill(1));
  const sx=1+2*((R()*((N-1)/2))|0),sy=1+2*((R()*((N-1)/2))|0);
  const st=[[sx,sy]];g[sy][sx]=0;
  while(st.length){
    const [x,y]=st[st.length-1];
    const nb=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>0&&ny>0&&nx<N-1&&ny<N-1&&g[ny][nx]===1});
    if(!nb.length){st.pop();continue}
    const [dx,dy]=nb[(R()*nb.length)|0];
    g[y+dy/2][x+dx/2]=0;g[y+dy][x+dx]=0;st.push([x+dx,y+dy]);
  }
  for(let i=0;i<7;i++){
    const cx=1+2*(1+((R()*(N/2-3))|0)),cy=1+2*(1+((R()*(N/2-3))|0));
    if(Math.abs(cx-sx)<=2&&Math.abs(cy-sy)<=2)continue;
    for(let y=cy-1;y<=cy+1;y++)for(let x=cx-1;x<=cx+1;x++)if(x>0&&y>0&&x<N-1&&y<N-1)g[y][x]=0;
  }
  // walking distance between two open cells without breaking anything (capped)
  const walk=(ax,ay,bx,by,cap)=>{const D=new Int16Array(N*N).fill(-1),q=[key(ax,ay)];D[q[0]]=0;
    for(let h=0;h<q.length;h++){const k=q[h],x=k%N,y=(k/N)|0;if(x===bx&&y===by)return D[k];if(D[k]>=cap)continue;
      for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d],nk=key(nx,ny);if(g[ny][nx]===0&&D[nk]<0){D[nk]=D[k]+1;q.push(nk)}}}
    return cap+1};
  // a few walls between corridors open into loops; cracked walls only go where breaking them saves a long walk
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){
    if(g[y][x]!==1)continue;
    const h=g[y][x-1]===0&&g[y][x+1]===0&&g[y-1][x]===1&&g[y+1][x]===1;
    const v=g[y-1][x]===0&&g[y+1][x]===0&&g[y][x-1]===1&&g[y][x+1]===1;
    if(!h&&!v)continue;
    const r=R();
    if(r<0.05)g[y][x]=0;
    else if(r<0.14){const d=h?walk(x-1,y,x+1,y,16):walk(x,y-1,x,y+1,16);if(d>=14)g[y][x]=2}
  }
  const dist=new Int32Array(N*N).fill(-1),q=[[sx,sy]];dist[key(sx,sy)]=0;let far=[sx,sy];const floors=[];
  for(let h=0;h<q.length;h++){const [x,y]=q[h];floors.push([x,y]);
    if(dist[key(x,y)]>dist[key(far[0],far[1])])far=[x,y];
    for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(g[ny][nx]===0&&dist[key(nx,ny)]<0){dist[key(nx,ny)]=dist[key(x,y)]+1;q.push([nx,ny])}}}
  const hasDown=n<LAST_FLOOR;
  const used=new Set([key(sx,sy)]);if(hasDown)used.add(key(far[0],far[1]));
  const near=([x,y],r)=>Math.abs(x-sx)+Math.abs(y-sy)<r||(hasDown&&Math.abs(x-far[0])+Math.abs(y-far[1])<3);
  const deadEnd=([x,y],strict)=>{let open=0,crack=0;for(let d=0;d<4;d++){const v=g[y+DY[d]][x+DX[d]];if(v===0)open++;else if(v===2)crack++}
    return open===1&&(!strict||crack===0)};
  const pick=(count,gaps,filter)=>{
    const out=[];
    for(const strict of[true,false])for(const gap of gaps){
      if(out.length>=count)break;
      const pool=floors.filter(p=>!used.has(key(p[0],p[1]))&&!near(p,4)&&deadEnd(p,strict)&&(!filter||filter(p)));
      for(let i=pool.length-1;i>0;i--){const j=(R()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]]}
      for(const p of pool){if(out.length>=count)break;
        if(out.every(s=>Math.abs(s[0]-p[0])+Math.abs(s[1]-p[1])>=gap)){out.push(p);used.add(key(p[0],p[1]))}}
    }
    return out;
  };
  // springs: 5 dead ends, spread out
  const items={};
  pick(Math.max(1,6-n),[12,9,6,3,0]).forEach(([x,y])=>items[key(x,y)]='spring');
  // treasure chests: 2 per floor level, also in dead ends; carve a small niche if the maze runs short
  const need=n*2,cells=pick(need,[8,5,3,0]);
  for(let tries=0;cells.length<need&&tries<4000;tries++){
    const x=1+((R()*(N-2))|0),y=1+((R()*(N-2))|0);
    if(g[y][x]!==1||x<1||y<1||x>N-2||y>N-2)continue;
    let open=0,ok=true,o=null;
    for(let d=0;d<4;d++){const v=g[y+DY[d]][x+DX[d]];if(v===0){open++;o=[x+DX[d],y+DY[d]]}else if(v===2)ok=false}
    if(!ok||open!==1||used.has(key(o[0],o[1]))||near([x,y],4))continue;
    if(x+DX[0]<1||y<2||x>N-3||y>N-3||x<2)continue;
    g[y][x]=0;cells.push([x,y]);used.add(key(x,y));
  }
  const chests={};
  cells.forEach(([x,y],i)=>{const it=(n===LAST_FLOOR&&i===0)?'宝剣':rollTreasure(n,R);chests[key(x,y)]={item:it,open:false}});
  // descending direction for the stone steps: away from the corridor that leads in
  let downDir=0;
  if(hasDown){for(let d=0;d<4;d++){if(g[far[1]+DY[d]][far[0]+DX[d]]===0){downDir=(d+2)%4;break}}}
  // everything must be reachable from the ladder without breaking a single wall (chests block their own tile)
  {const seen=new Uint8Array(N*N),q=[key(sx,sy)];seen[q[0]]=1;
    for(let h=0;h<q.length;h++){const k=q[h],x=k%N,y=(k/N)|0;
      for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d],nk=key(nx,ny);if(g[ny][nx]===0&&!chests[nk]&&!seen[nk]){seen[nk]=1;q.push(nk)}}}
    const touch=k=>{const x=k%N,y=(k/N)|0;for(let d=0;d<4;d++)if(seen[key(x+DX[d],y+DY[d])])return true;return false};
    const ok=Object.keys(items).every(k=>seen[k])&&(!hasDown||seen[key(far[0],far[1])])&&Object.keys(chests).every(k=>touch(+k));
    if(!ok)return genFloor(n);}
  return{n,grid:g,items,chests,seen:Array(N*N).fill(0),walked:Array(N*N).fill(0),enemies:[],
    up:{x:sx,y:sy},down:hasDown?{x:far[0],y:far[1]}:null,downDir};
}
function useFloor(F){
  S.grid=F.grid;S.items=F.items;S.chests=F.chests;S.seen=F.seen;S.walked=F.walked;S.enemies=F.enemies;S.up=F.up;S.down=F.down;S.downDir=F.downDir;
  springArr.fill(0);for(const k in F.items)if(F.items[k]==='spring')springArr[k]=1;
  chestArr.fill(0);for(const k in F.chests)chestArr[k]=1;
  upKey=key(F.up.x,F.up.y);downKey=F.down?key(F.down.x,F.down.y):-1;
}
function openDir(x,y){for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(S.grid[ny][nx]===0&&!chestArr[key(nx,ny)])return d}return 0}
function enterFloor(n,via){
  if(!S.floors[n])S.floors[n]=genFloor(n);
  const F=S.floors[n],first=!F.visited;F.visited=true;
  S.floor=n;S.deepest=Math.max(S.deepest||0,n);useFloor(F);
  // arrive on the tile next to the stairs, with the stairs at your back
  const p=via==='up'?F.down:F.up;
  S.x=p.x;S.y=p.y;const od=openDir(p.x,p.y);S.x=p.x+DX[od];S.y=p.y+DY[od];S.d=od;
  if(!F.enemies.length){for(let i=0;i<n;i++){F.enemies.push({type:'ghost',x:-9,y:-9},{type:'mummy',x:-9,y:-9})}F.enemies.forEach(spawn)}
  S.walked[key(S.x,S.y)]=1;
  anim=null;strike=null;fades.length=0;cam.bob=cam.sway=cam.push=0;camAng=S.d*Math.PI/2;placeCam(S.x+0.5,S.y+0.5,camAng);
  setVis(visList(S.x,S.y,S.d));
  if(via==='up')say(`地下${n}階に戻ってきた。`);
  else if(n===1&&first)say('入口の縄ばしごを降りて、地下1階に着いた。宝を集めて、生きて地上へ戻ろう。');
  else if(first)say(`地下${n}階に降りた。${n===S.D.maxFloor?'ここが最深部だ。':''}魔物の気配が強くなった……`);
  else say(`地下${n}階に降りた。`);
}

/* ---------- map ---------- */
function drawMap(){
  const mc=$('mapcv'),box=view.getBoundingClientRect();
  const size=Math.floor(Math.min(box.width-32,box.height-110)),cs=Math.max(2,Math.floor(size/N)),s=cs*N,dpr=window.devicePixelRatio||1;
  mc.width=s*dpr;mc.height=s*dpr;mc.style.width=s+'px';mc.style.height=s+'px';
  const m=mc.getContext('2d');m.setTransform(dpr,0,0,dpr,0,0);m.fillStyle='#050607';m.fillRect(0,0,s,s);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const k=key(x,y),v=S.grid[y][x];
    if(!S.seen[k])continue;
    if(isWall(v))m.fillStyle=v===2?'#5a4634':'#2a2c30';
    else m.fillStyle=S.walked[k]?'#7a6a52':'#3e3a33';
    m.fillRect(x*cs,y*cs,cs,cs);
    if(!isWall(v)&&springArr[k]){m.fillStyle='#6fb3d9';m.beginPath();m.arc(x*cs+cs/2,y*cs+cs/2,cs*.38,0,Math.PI*2);m.fill()}
    if(chestArr[k]){const c=S.chests[k];m.fillStyle=c.open?'#6a5420':'#ffd25a';m.fillRect(x*cs+cs*.15,y*cs+cs*.22,cs*.7,cs*.56)}
  }
  const tri=(x,y,col,upw)=>{m.fillStyle=col;m.fillRect(x*cs,y*cs,cs,cs);m.fillStyle='#111';m.beginPath();
    if(upw){m.moveTo(x*cs+cs/2,y*cs+cs*.18);m.lineTo(x*cs+cs*.85,y*cs+cs*.8);m.lineTo(x*cs+cs*.15,y*cs+cs*.8)}
    else{m.moveTo(x*cs+cs/2,y*cs+cs*.82);m.lineTo(x*cs+cs*.85,y*cs+cs*.2);m.lineTo(x*cs+cs*.15,y*cs+cs*.2)}m.closePath();m.fill()};
  if(S.seen[upKey])tri(S.up.x,S.up.y,S.floor===1?'#cfe0ff':'#9fb4c8',true);
  if(S.down&&S.seen[downKey])tri(S.down.x,S.down.y,'#e88a6a',false);
  // you are here: a large red ▲ pointing the way you face, ringed so it stands out from the gold chests
  const px=S.x*cs+cs/2,py=S.y*cs+cs/2,u=Math.max(cs,4);
  const halo=m.createRadialGradient(px,py,0,px,py,u*2.4);halo.addColorStop(0,'rgba(255,90,70,.55)');halo.addColorStop(1,'rgba(255,90,70,0)');

      const al=Math.max(0,1-q*1.1);if(al<=0)continue;ctx.fillStyle=`rgba(${pc},${al.toFixed(3)})`;
      ctx.save();ctx.translate(x,y);ctx.rotate(pt.r+q*8);const sz=pt.s*Math.min(2,1/dz+0.5);
      if(s.kind==='mummy'||s.kind==='kill')ctx.fillRect(-sz*2.2,-sz*0.5,sz*4.4,sz);else{ctx.beginPath();ctx.arc(0,0,sz,0,Math.PI*2);ctx.fill()}ctx.restore()}
  }
  // onomatopoeia: heavy manga-style lettering, each glyph jostled and layered
  if(t>=90&&s.word)drawWord(s,t-90,tx,ty);
  ctx.restore();
}

const WALL_NOTES=['冷たく湿った岩壁だ。','ざらついた岩肌。水滴が伝っている。','硬い岩だ。びくともしない。','石英の粒が明かりを受けてきらりと光った。','岩肌に白い鍾乳石の膜が張りついている。'];
function openChest(k){
  const c=S.chests[k],v=TV[c.item],x=k%N,y=(k/N)|0;
  c.open=true;S.bag.push({name:c.item,v,floor:S.floor});
  SFX.chest(v);buzz([20,40,60]);
  strike={t0:performance.now()-90,kind:'treasure',word:c.item+'！',X:x+0.5,Y:y+0.5,h:0.05,parts:makeParts('treasure')};
  say(`宝箱を開けた！ ${c.item}（${fmt(v)}pt）を手に入れた！`);
  const l=$('lootLbl');l.classList.remove('pop');void l.offsetWidth;l.classList.add('pop');
  liveScene=true;dirty=true;
}
function examine(){
  if(!locked()&&(key(S.x,S.y)===upKey||key(S.x,S.y)===downKey)){audio();closeMap();snap();stairsPrompt();return}
  act(counted(()=>{
  const a=cell(1,0),ak=key(a.x,a.y),av=get(a.x,a.y),ck=key(S.x,S.y),e=enemyAt(a.x,a.y);
  if(e){SFX.examine();say(e.type==='ghost'?'青白く透けた人影……触れられたら呪われそうだ。叩けば消えるかもしれない。':'包帯でぐるぐる巻きの男。腐った布のにおいがする。');return}
  if(chestArr[ak]){if(S.chests[ak].open){SFX.examine();say('空っぽの宝箱だ。もう何も入っていない。');return}openChest(ak);return}
  if(springArr[ck]||(!isWall(av)&&springArr[ak])){
    const was=S.skin;S.skin=SKIN;SFX.spring();buzz(20);
    if(S.curse>=2){say('泉の水を口に含んだが、渇きが少しも癒えない……呪いのせいだ。水筒だけは満たしておいた。');return}
    S.water=100;warned.thirsty=warned.dry=0;
    say(was<SKIN?'泉の水を心ゆくまで飲み、水筒をいっぱいに満たした。':'泉の水を飲んだ。冷たくておいしい。水筒はもう満杯だ。');
  }else if(av===2){S.grid[a.y][a.x]=0;SFX.crumble();fx('shake');buzz(60);setVis(visList(S.x,S.y,S.d));say('ひびに手をかけて押すと、岩壁がガラガラと崩れた！ 道が開けた。')}
  else if(av===1){SFX.examine();say(WALL_NOTES[hash(a.x,a.y,S.d)%WALL_NOTES.length])}
  else if(ak===upKey){SFX.examine();say(S.floor===1?'入口の縄ばしごだ。上から外の光が差している。':'上の階へ続く縄ばしごだ。')}
  else if(ak===downKey){SFX.examine();say('下へ続く石段だ。進めば下の階へ降りられる。')}
  else{SFX.examine();say('足元を照らしてみたが、特に何もない。')}
}))}
function drink(){act(counted(()=>{
  if(S.skin<=0){SFX.empty();say('水筒は空っぽだ。泉を探さないと。');return false}
  S.skin--;SFX.drink();
  if(S.curse>=2){say(`水筒の水を飲んだが、喉の渇きが少しも癒えない……呪いのせいだ。（残り ${S.skin}口）`);return}
  S.water=Math.min(100,S.water+20);warned.thirsty=warned.dry=0;
  say(S.skin>0?`水筒から水を飲んだ。（水分 +20／残り ${S.skin}口）`:'最後の一口を飲み干した。水筒は空っぽだ。');
}))}

/* ---------- stairs ---------- */
function ask(html,yes,no,cb){
  asking=true;askCb=cb;$('askText').innerHTML=html;$('askYes').textContent=yes;$('askNo').textContent=no;$('askOv').hidden=false;
  setTimeout(()=>{try{$('askYes').focus({preventScroll:true})}catch(e){}},0);
}
function hideAsk(){asking=false;askCb=null;$('askOv').hidden=true}
function stairsPrompt(){
  if(S.over)return;
  const k=key(S.x,S.y);
  if(k===downKey){
    if(S.floor>=S.D.maxFloor){say('これ以上は危険だからやめておこう。');return}
    ask(`<b>地下${S.floor+1}階</b>へ降りますか？`,'降りる','やめる',()=>changeFloor(S.floor+1,'down'));
  }else if(k===upKey){
    if(S.floor===1)ask(`<b>地上</b>へ戻りますか？\n持っている宝 <b>${fmt(loot())}pt</b> を持ち帰って、探索を終えます。`,'地上へ戻る','まだ探索する',()=>end(true));
    else ask(`<b>地下${S.floor-1}階</b>へ上りますか？`,'上る','やめる',()=>changeFloor(S.floor-1,'up'));
  }
}
function changeFloor(n,via){
  fading=true;closeMap();SFX.stairs(via==='down');
  const f=$('fadeOv');$('fadeText').textContent=`地下${n}階`;f.hidden=false;void f.offsetWidth;f.classList.add('on');
  setTimeout(()=>{
    enterFloor(n,via);update();dirty=true;
    setTimeout(()=>{f.classList.remove('on');setTimeout(()=>{f.hidden=true;fading=false;dirty=true},360)},650);
  },420);
}

/* ---------- end of a run ---------- */
function end(win,why){
  if(S.over)return;
  S.over=win?'win':'dead';closeMap();hideAsk();
  const score=win?loot():0;
  if(win)SFX.win();else SFX.death();
  const r=ranking.reportScore(score);
  setTimeout(()=>showResult(win,why,score,r),win?700:1100);
}
function showResult(win,why,score,r){
  const cause={mummy:'ミイラ男に打ち倒された……',thirst:'渇きに耐えきれず、暗闇の中で倒れた……',wall:'岩壁にぶつかり続け、力尽きた……'}[why]||'暗闇の中で動けなくなった……';
  const head=$('resHead');head.className='res-head'+(win?'':' dead');
  head.textContent=win?(r.isBest&&score>0?'自己ベスト更新！':'帰還成功！'):'力尽きた……';
  $('resSub').textContent=win?`${S.D.name}　地下${S.deepest}階まで探索して、無事に地上へ戻った。`:`${cause}\n集めた宝はすべて迷宮に消えた。`;
  $('resLabel').textContent=win?'持ち帰った宝':'記録';
  $('resScore').textContent=fmt(score)+'pt';
  const list=$('resList');list.innerHTML='';
  const groups={};for(const b of S.bag){groups[b.name]=groups[b.name]||{n:0,v:b.v};groups[b.name].n++}
  const rows=Object.entries(groups).sort((a,b)=>b[1].v-a[1].v);
  if(!rows.length){const li=document.createElement('li');li.className='none';li.textContent=win?'宝はひとつも持ち帰れなかった':'—';list.appendChild(li)}
  for(const [name,g] of rows){const li=document.createElement('li');
    li.innerHTML=`<span></span><span></span><span></span>`;li.children[0].textContent=name;li.children[1].textContent=`${fmt(g.v)}pt × ${g.n}`;
    li.children[2].textContent=win?fmt(g.v*g.n)+'pt':'失った';list.appendChild(li)}
  showSummary(ranking.getSummary());
  $('resultScr').hidden=false;
}
function showSummary(s){
  $('titleBest').textContent=`自己ベスト ${fmt(s.best)}pt`;
  $('resBest').textContent=`自己ベスト ${fmt(s.best)}pt`+(s.rank?` ／ 全体 ${s.rank}位`:'');
  $('resStatus').textContent=s.status;
}

function update(){
  if(!S)return;
  const set=(id,v)=>{$('v'+id).textContent=Math.round(v);$('b'+id).firstElementChild.style.width=clamp(v,0,100)+'%'};
  set('Hp',S.hp);set('Wat',S.water);
  $('skin').innerHTML=Array.from({length:SKIN},(_,i)=>`<i class="${i<S.skin?'on':''}"></i>`).join('');
  $('skin').setAttribute('aria-label',`水筒 残り${S.skin}口`);
  $('curse').innerHTML=Array.from({length:3},(_,i)=>`<i class="${i<S.curse?'on':''}"></i>`).join('');
  $('curseLbl').textContent=S.curse>0?`呪い（あと${S.D.curseLift-S.curseSteps}歩で1段階解ける）`:'呪い';
  $('dir').textContent=DIRN[S.d];
  $('floorLbl').textContent=`地下${S.floor}階`;
  $('lootLbl').textContent=`宝 ${fmt(loot())}pt`;
  if(!$('mapOv').hidden)drawMap();
}
function openMap(){
  if(locked()||!$('mapOv').hidden)return;
  audio();snap();$('mapOv').hidden=false;$('bM').setAttribute('aria-pressed','true');SFX.map();drawMap();
  enemyTurn();update();
  if($('mapOv').hidden)return;
  let n=10;const cd=$('mapCd');cd.textContent=n;cd.classList.remove('zero');
  mapTimer=setInterval(()=>{
    if(!S||S.over||ranking.isPanelOpen()){closeMap();return}
    n--;cd.textContent=n;
    if(n<=0){cd.classList.add('zero');enemyTurn();update();n=10;
      setTimeout(()=>{if(!$('mapOv').hidden){cd.textContent=10;cd.classList.remove('zero')}},450)}
  },1000);
}
function closeMap(){
  if(mapTimer){clearInterval(mapTimer);mapTimer=null}
  if($('mapOv').hidden)return;
  $('mapOv').hidden=true;$('bM').setAttribute('aria-pressed','false');
}
function toggleMap(){if($('mapOv').hidden)openMap();else closeMap()}

/* ---------- title ---------- */
let diffSel='normal';
try{const v=localStorage.getItem('dungeon-attack-diff');if(v==='easy'||v==='normal')diffSel=v}catch(e){}
function syncDiff(){$('dEasy').setAttribute('aria-checked',String(diffSel==='easy'));$('dNormal').setAttribute('aria-checked',String(diffSel==='normal'))}
function pickDiff(d){if(MaruoOpening.isPlaying()||ranking.isPanelOpen())return;diffSel=d;syncDiff();try{localStorage.setItem('dungeon-attack-diff',d)}catch(e){};SFX.examine()}
function showTitle(){
  $('resultScr').hidden=true;$('titleScr').hidden=false;syncDiff();showSummary(ranking.getSummary());
  $('titleChest').src=SPR_SRC.chestC;
}
function startGame(){
  if(MaruoOpening.isPlaying()||ranking.isPanelOpen())return;
  audio();ensureTextures();
  S={diff:diffSel,D:DIFF[diffSel],floors:[],floor:0,x:0,y:0,d:0,hp:100,water:100,skin:SKIN,steps:0,over:null,
     curse:0,curseSteps:0,drainAcc:0,regenAcc:0,bag:[]};
  warned={};hurt=0;busy=false;hideAsk();closeMap();
  enterFloor(1,'down');
  $('titleScr').hidden=true;$('resultScr').hidden=true;
  update();resize();
}

/* ---------- sizing & input ---------- */
function resize(){
  const r=view.getBoundingClientRect();DPR=window.devicePixelRatio||1;W=r.width;H=r.height;
  if(W<10||H<10)return;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  RW=Math.round(clamp(W*DPR,200,420));RH=Math.round(RW*H/W);
  off.width=RW;off.height=RH;img=octx.createImageData(RW,RH);buf=img.data;zbuf=new Float32Array(RW);
  Fp=Math.max(RW*0.5,RH*0.4);
  dirty=true;if(S&&!$('mapOv').hidden)drawMap();
}
new ResizeObserver(resize).observe(view);
$('bF').onclick=()=>move(1);
$('bL').onclick=()=>turn(-1);$('bR').onclick=()=>turn(1);
$('bX').onclick=examine;$('bH').onclick=hit;$('bE').onclick=drink;$('bM').onclick=toggleMap;
$('mapOv').onclick=closeMap;
$('askYes').onclick=()=>{if(ranking.isPanelOpen())return;const cb=askCb;hideAsk();if(cb)cb()};
$('askNo').onclick=()=>{if(ranking.isPanelOpen())return;hideAsk();look()};
$('dEasy').onclick=()=>pickDiff('easy');$('dNormal').onclick=()=>pickDiff('normal');
$('startBtn').onclick=startGame;
$('titleRank').onclick=()=>{if(!MaruoOpening.isPlaying())ranking.openPanel()};
$('resRank').onclick=()=>{if(!MaruoOpening.isPlaying())ranking.openPanel()};
$('againBtn').onclick=()=>{if(MaruoOpening.isPlaying()||ranking.isPanelOpen())return;S=null;showTitle()};
ranking.onChange(showSummary);
function syncSnd(){$('sndBtn').setAttribute('aria-pressed',String(!muted));$('sndBtn').textContent=muted?'音 オフ':'音 オン'}
$('sndBtn').onclick=()=>{muted=!muted;try{localStorage.setItem('dungeon-attack-mute',muted?'1':'0')}catch(e){}
  if(MASTER)MASTER.gain.value=muted?0:0.85;if(!muted){audio();if(MASTER)MASTER.gain.value=0.85;SFX.examine()}syncSnd()};
syncSnd();
window.addEventListener('keydown',e=>{
  if(MaruoOpening.isPlaying()||ranking.isPanelOpen())return;
  const k=e.key;
  if(asking){if(k==='Escape'){hideAsk();look();e.preventDefault()}return}
  if(!$('titleScr').hidden||!$('resultScr').hidden)return;
  if(k==='ArrowUp'||k==='w'){move(1)}
  else if(k==='ArrowLeft'||k==='a'){turn(-1)}else if(k==='ArrowRight'||k==='d'){turn(1)}
  else if(k===' '||k==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON'&&k==='Enter')return;examine()}
  else if(k==='f'){hit()}else if(k==='e'){drink()}else if(k==='m'){toggleMap()}else return;
  e.preventDefault();
});

let texturesReady=false;
function ensureTextures(){if(!texturesReady){buildTextures();texturesReady=true}}
try{document.fonts&&document.fonts.load('40px "Dela Gothic One"','ダンジョンアタックバシッ！ドゴォッシュワゴツンガラスカ宝剣宝盾指輪腕輪歴史書ネックレスメダルツボ')}catch(e){}
MaruoOpening.play().then(showTitle);
setTimeout(ensureTextures,80);
requestAnimationFrame(frame);
})();
</script>
